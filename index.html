<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hallo Juri Nils</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background-color: #f7f5f0; }
    iframe { width: 100%; height: 100%; border: none; }

    /* Standardmäßig (für Desktop) wird die Desktop-Ansicht gezeigt und Handy versteckt */
    .desktop-ansicht { display: block; }
    .handy-ansicht { display: none; }

    /* Wenn der Bildschirm schmaler als 768px ist (Smartphones), drehen wir das um */
    @media (max-width: 768px) {
      .desktop-ansicht { display: none; }
      .handy-ansicht { display: block; }
    }
  </style>
</head>
<body>

  <!-- Desktop-Ansicht (Figma-UI ausgeblendet) -->
  <iframe class="desktop-ansicht" src="https://www.figma.com/embed?embed_host=share&url=https://www.figma.com/proto/u1q1dR2uX5GU188liaq0Fg/Karte-Juri-Handy-Final-zum-versenden?node-id=41-3%26t=QK7DGWvw7cu7IhIZ-1%26hide-ui=1" allowfullscreen></iframe>

  <!-- Handy-Ansicht (Figma-UI ausgeblendet) -->
  <iframe class="handy-ansicht" src="https://www.figma.com/embed?embed_host=share&url=https://www.figma.com/proto/u1q1dR2uX5GU188liaq0Fg/Karte-Juri-Handy-Final-zum-versenden?node-id=1-420%26t=QK7DGWvw7cu7IhIZ-1%26hide-ui=1" allowfullscreen></iframe>

</body>
</html>
